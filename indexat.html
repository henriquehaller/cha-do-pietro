<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chá de bebê do Pietro</title>
  <meta name="description" content="Chá de bebê do Pietro">

  <!-- Open Graph / WhatsApp -->
  <meta property="og:title" content="Chá de bebê do Pietro">
  <meta property="og:description" content="Chá de bebê do Pietro">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://henriquehaller.github.io/cha-do-pietro/">
  <meta property="og:image" content="https://henriquehaller.github.io/cha-do-pietro/cha-bebe-pietro-preview.jpg">
  <meta property="og:image:secure_url" content="https://henriquehaller.github.io/cha-do-pietro/cha-bebe-pietro-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Chá de bebê do Pietro">

  <style>
    :root {
      --bg: #f7f3ea;
      --sage: #7e8f68;
      --brown: #725a43;
      --cream: #fffdf8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--brown);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(920px, 100%);
      background: var(--cream);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(80, 67, 49, .12);
      border: 1px solid rgba(126, 143, 104, .18);
    }
    .hero {
      display: block;
      width: 100%;
      height: auto;
    }
    .actions {
      padding: 18px;
      text-align: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(420px, 100%);
      min-height: 54px;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--sage);
      color: white;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .03em;
      box-shadow: 0 8px 18px rgba(126, 143, 104, .22);
    }
    .hint {
      margin: 10px 0 0;
      font-size: 13px;
      opacity: .7;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="hero" src="cha-bebe-pietro-preview.jpg" alt="Chá de bebê do Pietro">
    <div class="actions">
      <a class="btn" href="https://script.google.com/macros/s/AKfycbwRbDcu3OPbgRXQ0PPzbBo0UvCCWBGcPLAQYWcIxxgDrkAOxBCdSKd-3J4FSiDvJJnN/exec">Abrir convite</a>
      <p class="hint">Toque para ver os detalhes e confirmar sua presença.</p>
    </div>
  </main>
</body>
</html>
