  <style>
    :root {
      --cream: #f9f5eb;
      --paper: #fffdf7;
      --sage: #667660;
      --sage-dark: #425040;
      --brown: #80694f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--brown);
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      overflow: hidden;
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(66, 80, 64, .12);
      border: 1px solid rgba(102, 118, 96, .18);
    }

    .preview {
      display: block;
      width: 100%;
      height: auto;
    }

    .content {
      padding: 22px;
      text-align: center;
    }

    .content p {
      margin: 0 0 16px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--sage);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>

  <main class="card">
